apiVersion: 1

providers:
  - name: 'PatientFlow'
    orgId: 1
    folder: 'PatientFlow'
    folderUid: patientflow
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
