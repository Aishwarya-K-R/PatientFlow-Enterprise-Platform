groups:
  # ===========================================================================
  # Service availability - the highest-priority signal. If a service stops
  # responding to Prometheus scrapes, something is fundamentally wrong.
  # ===========================================================================
  - name: service-availability
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Service {{ $labels.service }} is down"
          description: "Prometheus has not been able to scrape {{ $labels.job }} for over 1 minute. The container may be crashed, unhealthy, or unreachable on the network."
          runbook: "docker ps to check container state; docker logs {{ $labels.service }}-service --tail 100 for cause."

  # ===========================================================================
  # Request health (RED method - Rate, Errors, Duration)
  # Uses prometheus-net's auto-emitted http_request_duration_seconds_* family.
  # ===========================================================================
  - name: request-health
    interval: 30s
    rules:
      - alert: HighErrorRate
        # 5xx ratio over total requests, evaluated over a 5-min rolling window.
        # The 'or vector(0)' guard prevents division-by-zero when there's no traffic.
        expr: |
          (
            sum by (service) (rate(http_requests_received_total{code=~"5.."}[5m]))
            /
            sum by (service) (rate(http_requests_received_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          category: errors
        annotations:
          summary: "{{ $labels.service }} returning >5% server errors"
          description: "{{ $labels.service }} has emitted 5xx responses for more than 5% of requests over the last 5 minutes (current value: {{ $value | humanizePercentage }})."
          runbook: "Open the Overview dashboard for {{ $labels.service }} and pivot to Tempo to find a representative failing trace."

      - alert: HighLatency
        # p95 latency from prometheus-net's histogram. Computed per service via le bucket.
        expr: |
          histogram_quantile(
            0.95,
            sum by (service, le) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
          category: latency
        annotations:
          summary: "{{ $labels.service }} p95 latency above 2s"
          description: "95th percentile request duration for {{ $labels.service }} has been above 2 seconds for 5 minutes (current: {{ $value | humanizeDuration }})."
          runbook: "Check the Tempo Explore for slow traces; common causes are DB lock contention, Kafka backpressure, or downstream LLM stalls."

  # ===========================================================================
  # Kafka publish reliability - failures here mean events are being dropped
  # (the outbox catches them, but the alert tells us the broker is unhappy).
  # ===========================================================================
  - name: kafka
    interval: 30s
    rules:
      - alert: KafkaPublishFailures
        # Counter is monotonic; rate>0 means failures are still happening.
        # 0.1/sec sustained over 5min = ~30 failures, enough to warrant a page.
        expr: sum by (topic) (rate(kafka_messages_failed_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          category: messaging
        annotations:
          summary: "Kafka publish failures on topic {{ $labels.topic }}"
          description: "Topic {{ $labels.topic }} has been failing publishes at {{ $value | humanize }}/sec for 5 minutes. Broker connectivity or topic configuration issue likely."
          runbook: "docker logs kafka --tail 200; check if broker is healthy and topic exists."

  # ===========================================================================
  # LLM performance - external API, so we expect occasional slowness but
  # sustained p95 > 30s is unusable for end users.
  # ===========================================================================
  - name: llm
    interval: 30s
    rules:
      - alert: LLMSlowResponse
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(llm_request_duration_seconds_bucket[5m]))
          ) > 30
        for: 5m
        labels:
          severity: warning
          category: latency
          service: ai
        annotations:
          summary: "LLM p95 latency above 30s"
          description: "The AI service's 95th-percentile LLM call duration has been above 30 seconds for 5 minutes (current: {{ $value | humanizeDuration }}). User experience is degraded."
          runbook: "Check Ollama container health: docker logs ollama --tail 100; consider scaling or warming the model."

  # ===========================================================================
  # Outbox backlog - if rows pile up, the publisher loop is stalled and
  # downstream consumers are not seeing events.
  # ===========================================================================
  - name: outbox
    interval: 30s
    rules:
      - alert: OutboxBacklog
        # Gauge set by each service's OutboxPublisherService on every 10s poll.
        # >100 unpublished rows means the publisher can't keep up with producers.
        expr: outbox_pending_messages > 100
        for: 5m
        labels:
          severity: warning
          category: messaging
        annotations:
          summary: "Outbox backlog growing on {{ $labels.service }}"
          description: "{{ $labels.service }} has {{ $value }} unpublished outbox rows for more than 5 minutes. Kafka publishes are not draining fast enough."
          runbook: "Check Kafka health and outbox publisher logs: docker logs {{ $labels.service }}-service | grep -i outbox."

  # ===========================================================================
  # Cache effectiveness - informational, not an outage.
  # A persistently low hit ratio means the cache is sized wrong, the warmup
  # job is broken, or invalidation is too aggressive.
  # ===========================================================================
  - name: cache
    interval: 60s
    rules:
      - alert: CacheHitRatioLow
        # hits / (hits + misses), evaluated over a 10min window.
        # 'sum without (tier)' collapses the L1/L2 tier label so we see the
        # overall effectiveness. Only fire when there's measurable traffic
        # (>0.5 req/s of cache lookups) to avoid spurious low-load alerts.
        expr: |
          (
            sum(rate(redis_cache_hits_total[10m]))
            /
            (sum(rate(redis_cache_hits_total[10m])) + sum(rate(redis_cache_misses_total[10m])))
          ) < 0.5
          and
          (sum(rate(redis_cache_hits_total[10m])) + sum(rate(redis_cache_misses_total[10m]))) > 0.5
        for: 15m
        labels:
          severity: info
          category: performance
        annotations:
          summary: "Patient cache hit ratio below 50%"
          description: "Patient service cache is hitting {{ $value | humanizePercentage }} of lookups over the last 10 minutes. The cache may be undersized or invalidation may be too eager."
          runbook: "Check cache warmup job and TTL configuration; review Patient service logs for cache evictions."
