services:
  # ===========================================================================
  # Infrastructure
  # ===========================================================================
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - patientflow-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - patientflow-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - patientflow-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - patientflow-network

  # ===========================================================================
  # Microservices
  # ===========================================================================
  gateway:
    build:
      context: .
      dockerfile: src/PMS.Gateway/Dockerfile
    container_name: gateway
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "${GATEWAY_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Kafka__BootstrapServers: kafka:29092
      ReverseProxy__Clusters__auth-cluster__Destinations__auth-service__Address: http://auth-service:8080/
      ReverseProxy__Clusters__patient-cluster__Destinations__patient-service__Address: http://patient-service:8080/
      ReverseProxy__Clusters__ai-cluster__Destinations__ai-service__Address: http://ai-service:8080/
      OpenTelemetry__OtlpEndpoint: http://tempo:4318
      Serilog__WriteTo__1__Args__uri: http://loki:3100
    networks:
      - patientflow-network

  auth-service:
    build:
      context: .
      dockerfile: src/PMS.Auth/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AUTH_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${AUTH_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      OpenTelemetry__OtlpEndpoint: http://tempo:4318
      Serilog__WriteTo__1__Args__uri: http://loki:3100
    networks:
      - patientflow-network

  patient-service:
    build:
      context: .
      dockerfile: src/PMS.Patient/Dockerfile
    container_name: patient-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "${PATIENT_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${PATIENT_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RedisConnection: redis:6379
      Jwt__Key: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      BillingService__Address: billing-service
      BillingService__Port: 8081
      Kafka__BootstrapServers: kafka:29092
      InternalApiKey: ${INTERNAL_API_KEY}
      OpenTelemetry__OtlpEndpoint: http://tempo:4318
      Serilog__WriteTo__1__Args__uri: http://loki:3100
    networks:
      - patientflow-network

  billing-service:
    build:
      context: .
      dockerfile: src/PMS.Billing/Dockerfile
    container_name: billing-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "${BILLING_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${BILLING_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Kafka__BootstrapServers: kafka:29092
      OpenTelemetry__OtlpEndpoint: http://tempo:4318
      Serilog__WriteTo__1__Args__uri: http://loki:3100
    networks:
      - patientflow-network

  ai-service:
    build:
      context: .
      dockerfile: src/PMS.AI/Dockerfile
    container_name: ai-service
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      patient-service:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "${AI_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__RedisConnection: redis:6379
      Jwt__Key: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      AI__Endpoint: ${AI_ENDPOINT}
      AI__Model: ${AI_MODEL}
      PatientService__BaseUrl: http://patient-service:8080
      PatientService__InternalApiKey: ${INTERNAL_API_KEY}
      Kafka__BootstrapServers: kafka:29092
      OpenTelemetry__OtlpEndpoint: http://tempo:4318
      Serilog__WriteTo__1__Args__uri: http://loki:3100
    networks:
      - patientflow-network

  # ===========================================================================
  # Observability - Tempo (Distributed Tracing)
  # ===========================================================================
  tempo:
    image: grafana/tempo:2.4.0
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./observability/tempo-config.yaml:/etc/tempo.yaml
      - tempo-data:/tmp/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API
      - "4318:4318"   # OTLP HTTP receiver
    networks:
      - patientflow-network

  # ===========================================================================
  # Observability - Loki (Log Aggregation)
  # ===========================================================================
  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    command: [ "-config.file=/etc/loki/loki-config.yaml" ]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml
      - loki-data:/loki
    ports:
      - "3100:3100"   # Loki HTTP API
    networks:
      - patientflow-network

  # ===========================================================================
  # Observability - Prometheus (Metrics)
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"   # Prometheus UI
    depends_on:
      - alertmanager
    networks:
      - patientflow-network

  # ===========================================================================
  # Observability - Alertmanager (Alert routing + notifications)
  # ===========================================================================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"   # Alertmanager UI
    extra_hosts:
      # Lets the container reach a webhook listener on the host machine
      - "host.docker.internal:host-gateway"
    networks:
      - patientflow-network

  # ===========================================================================
  # Observability - Grafana (Visualization)
  # ===========================================================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      # Datasources + dashboard providers (auto-provisioned on startup)
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      # Actual dashboard JSON files referenced by the provider above
      - ./observability/grafana/dashboards:/etc/grafana/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"   # Grafana UI
    depends_on:
      - tempo
      - loki
      - prometheus
    networks:
      - patientflow-network

networks:
  patientflow-network:
    driver: bridge

volumes:
  postgres-data:
  tempo-data:
  loki-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
