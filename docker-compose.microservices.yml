version: '3.8'

services:
  # Infrastructure
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: patientflow_auth,patientflow_patient,patientflow_billing
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/create-multiple-databases.sh:/docker-entrypoint-initdb.d/create-multiple-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - patientflow-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - patientflow-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - patientflow-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - patientflow-network

  # Microservices
  gateway:
    build:
      context: .
      dockerfile: src/PMS.Gateway/Dockerfile
    container_name: gateway
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Kafka__BootstrapServers: kafka:29092
      ReverseProxy__Clusters__auth-cluster__Destinations__auth-service__Address: http://auth-service:8080/
      ReverseProxy__Clusters__patient-cluster__Destinations__patient-service__Address: http://patient-service:8080/
      ReverseProxy__Clusters__ai-cluster__Destinations__ai-service__Address: http://ai-service:8080/
    networks:
      - patientflow-network

  auth-service:
    build:
      context: .
      dockerfile: src/PMS.Auth/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=patientflow_auth;Username=postgres;Password=postgres
      Jwt__Key: your-super-secret-jwt-key-min-32-chars-long-please-change-in-production
      Jwt__Issuer: PatientFlow.Auth
      Jwt__Audience: PatientFlow.Api
    networks:
      - patientflow-network

  patient-service:
    build:
      context: .
      dockerfile: src/PMS.Patient/Dockerfile
    container_name: patient-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=patientflow_patient;Username=postgres;Password=postgres
      ConnectionStrings__RedisConnection: redis:6379
      Jwt__Key: your-super-secret-jwt-key-min-32-chars-long-please-change-in-production
      Jwt__Issuer: PatientFlow.Auth
      Jwt__Audience: PatientFlow.Api
      BillingService__Address: billing-service
      BillingService__Port: 8080
      Kafka__BootstrapServers: kafka:29092
    networks:
      - patientflow-network

  billing-service:
    build:
      context: .
      dockerfile: src/PMS.Billing/Dockerfile
    container_name: billing-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=patientflow_billing;Username=postgres;Password=postgres
      Kafka__BootstrapServers: kafka:29092
    networks:
      - patientflow-network

  ai-service:
    build:
      context: .
      dockerfile: src/PMS.AI/Dockerfile
    container_name: ai-service
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__RedisConnection: redis:6379
      Jwt__Key: your-super-secret-jwt-key-min-32-chars-long-please-change-in-production
      Jwt__Issuer: PatientFlow.Auth
      Jwt__Audience: PatientFlow.Api
      AI__Endpoint: http://host.docker.internal:11434/api/generate
      AI__Model: llama3.2
    networks:
      - patientflow-network

networks:
  patientflow-network:
    driver: bridge

volumes:
  postgres-data:
