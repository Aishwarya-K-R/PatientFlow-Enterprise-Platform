apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-deployment
  template:
    metadata:
      labels:
        app: ai-deployment
    spec:
      containers:
        - name: ai-deployment
          image: aishwaryakr/ai-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_CONN
            - name: ConnectionStrings__RedisConnection
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_CONN
            - name: Kafka__BootstrapServers
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            # Ollama endpoints + model names come from the ConfigMap so ops
            # can swap models (e.g. llama3.2 -> llama3.1) without rebuilding
            # the AI image. Points at ollama-service (ClusterIP) which fronts
            # ollama-deployment; models are pre-pulled by ollama-pull Job.
            - name: AI__Endpoint
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: OLLAMA_GENERATE_ENDPOINT
            - name: AI__Model
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: OLLAMA_CHAT_MODEL
            - name: AI__EmbeddingEndpoint
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: OLLAMA_EMBEDDING_ENDPOINT
            - name: AI__EmbeddingModel
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: OLLAMA_EMBEDDING_MODEL