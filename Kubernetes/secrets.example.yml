# =============================================================================
# secrets.example.yml — placeholder template for Kubernetes Secret
# =============================================================================
# To use:
#   1. Copy this file to secrets.yml in the same directory.
#         cp Kubernetes/secrets.example.yml Kubernetes/secrets.yml
#   2. Fill in real values in secrets.yml.
#   3. Apply with:  kubectl apply -f Kubernetes/secrets.yml
#
# Kubernetes/secrets.yml is gitignored — your real values stay local.
#
# NOTE: Plain `Secret` manifests with stringData are fine for local dev clusters
# (Minikube / kind). In Phase 8 we'll replace this with Sealed Secrets / SOPS
# so encrypted values can live safely in git.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  POSTGRES_USER: <db-username>
  POSTGRES_PASSWORD: <strong-random-password>
  POSTGRES_DB: <database-name>

  # Hostname is `postgres-service` here (a Kubernetes Service name),
  # not `postgres` (which is the docker-compose service name).
  DB_CONN: "Host=postgres-service;Port=5432;Database=<database-name>;Username=<db-username>;Password=<strong-random-password>"

  # Generate with:
  #   PowerShell: [Convert]::ToBase64String([System.Security.Cryptography.RandomNumberGenerator]::GetBytes(48))
  #   Linux/macOS: openssl rand -base64 48
  JWT_SECRET: <base64-of-at-least-48-random-bytes>

  # MCP service reads from both patient and billing databases, so it needs
  # its own connection strings. Keep the credentials aligned with DB_CONN.
  MCP_PATIENT_DB_CONN: "Host=postgres-service;Port=5432;Database=patientflow_patient;Username=<db-username>;Password=<strong-random-password>"
  MCP_BILLING_DB_CONN: "Host=postgres-service;Port=5432;Database=patientflow_billing;Username=<db-username>;Password=<strong-random-password>"

  # Per-agent API keys for the MCP server. Each agent (Claude Desktop,
  # Claude Code, custom bots) gets its own key so calls can be attributed
  # and revoked independently. Rotate by editing the Secret and restarting
  # the mcp-deployment pods.
  MCP_APIKEY_CLAUDE_DESKTOP: <random-key-for-claude-desktop>
  MCP_APIKEY_CLAUDE_CODE: <random-key-for-claude-code>
