apiVersion: v1
kind: Service
metadata:
  name: ollama-service
spec:
  # ClusterIP is enough: only in-cluster callers (ai-service, ollama-pull
  # Job) hit Ollama. If a dev needs to poke it from their laptop, use
  # `kubectl port-forward svc/ollama-service 11434:11434`.
  selector:
    app: ollama-deployment
  ports:
    - port: 11434
      targetPort: 11434
