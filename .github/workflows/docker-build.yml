
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Auth Service
        run: |
          docker build -t aishwaryakr/auth-service:latest -f src/PMS.Auth/Dockerfile .
          docker push aishwaryakr/auth-service:latest

      - name: Build & Push Patient Service
        run: |
          docker build -t aishwaryakr/patient-service:latest -f src/PMS.Patient/Dockerfile .
          docker push aishwaryakr/patient-service:latest

      - name: Build & Push Billing Service
        run: |
          docker build -t aishwaryakr/billing-service:latest -f src/PMS.Billing/Dockerfile .
          docker push aishwaryakr/billing-service:latest

      - name: Build & Push AI Service
        run: |
          docker build -t aishwaryakr/ai-service:latest -f src/PMS.AI/Dockerfile .
          docker push aishwaryakr/ai-service:latest

      - name: Build & Push API Gateway
        run: |
          docker build -t aishwaryakr/api-gateway:latest -f src/PMS.Gateway/Dockerfile .
          docker push aishwaryakr/api-gateway:latest

      - name: Build & Push MCP Service
        run: |
          docker build -t aishwaryakr/mcp-service:latest -f src/PMS.Mcp/Dockerfile .
          docker push aishwaryakr/mcp-service:latest
